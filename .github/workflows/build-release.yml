name: Build Release

on:
  push:
    branches: [master]
    tags: ["v[1-9].*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "APP_VERSION_NAME=$VERSION" >> $GITHUB_ENV
          else
            echo "APP_VERSION_NAME=0.0.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Build release
        run: |
          ./gradlew assembleProdRelease \
            -PappVersionName=$APP_VERSION_NAME

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: release-${{ github.run_number }}
          commit: ${{ github.sha }}
          name: CI Build ${{ env.APP_VERSION_NAME }}
          body: |
            ## CI Build ${{ env.APP_VERSION_NAME }}

            **Commit:** ${{ github.sha }}
          artifacts: app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk
          generateReleaseNotes: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk
